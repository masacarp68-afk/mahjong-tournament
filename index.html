<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麻雀トーナメント条件計算 問題ジェネレーター</title>
<style>
  :root{
    --green:#3aa856; --green-d:#2c8443; --ink:#1f2a24; --sub:#5b6b62;
    --line:#d7ded9; --bg:#f4f7f5; --card:#ffffff; --hi:#fff6d9; --hi-b:#e9c94a;
    --blue:#2563eb; --red:#c0392b; --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.6;-webkit-text-size-adjust:100%;
  }
  .wrap{max-width:860px;margin:0 auto;padding:16px}
  header.top{
    background:linear-gradient(90deg,var(--green),#7bc47f);color:#fff;border-radius:14px;
    padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px;
  }
  header.top h1{margin:0;font-size:20px;letter-spacing:.02em}
  header.top .rule{margin-top:6px;font-size:12.5px;opacity:.96}
  .controls{
    display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow)
  }
  .ctl{display:flex;flex-direction:column;gap:4px}
  .ctl label{font-size:11.5px;color:var(--sub);font-weight:600}
  .ctl select,.ctl input{
    font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;min-width:78px
  }
  button{font:inherit;cursor:pointer;border:none;border-radius:9px;padding:9px 15px;font-weight:700;transition:.12s}
  .btn-main{background:var(--green);color:#fff;box-shadow:var(--shadow)}
  .btn-main:hover{background:var(--green-d)}
  .btn-ghost{background:#eef2ef;color:var(--ink);border:1px solid var(--line)}
  .btn-ghost:hover{background:#e3e9e4}
  .spacer{flex:1}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 16px 18px;margin-bottom:14px}
  .flavor{font-size:12.5px;color:var(--sub);margin:0 0 10px}
  .flavor b{color:var(--green-d)}

  table.board{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
  table.board th,table.board td{border:1px solid var(--line);padding:8px 4px;text-align:center}
  table.board thead th{background:#eef4ef;font-weight:700}
  table.board .rowhdr{background:#f6f9f7;font-weight:700;font-size:12px;color:var(--sub);width:96px}
  table.board td.name{font-weight:700}
  .oya{display:inline-block;font-size:10px;background:var(--red);color:#fff;border-radius:4px;padding:1px 4px;margin-left:3px;vertical-align:middle}
  .tgt th,.tgt td{background:var(--hi)!important;}
  col.tgtcol{}
  .tgtbadge{display:inline-block;font-size:10px;background:var(--blue);color:#fff;border-radius:4px;padding:1px 5px;margin-left:3px;vertical-align:middle}
  .neg{color:var(--red)}

  .qline{margin:14px 0 6px;font-size:15px;font-weight:700}
  .qline .who{color:var(--blue)}
  .stand{border:1px dashed var(--line);border-radius:10px;margin:6px 0 2px;overflow:hidden;background:#fbfdfb}
  .stand-head{display:flex;align-items:center;gap:8px;padding:8px 11px;cursor:pointer;user-select:none;font-size:12.5px;font-weight:700;color:var(--green-d)}
  .stand-head .peek{margin-left:auto;font-size:11.5px;color:var(--sub);font-weight:700}
  .stand-body{display:none;padding:0 11px 10px;font-size:12.5px;color:var(--sub)}
  .stand-body b{color:var(--ink)}
  .stand.open .stand-body{display:block}
  .stand.open .stand-head .peek{display:none}

  .patterns{display:flex;flex-direction:column;gap:9px;margin-top:10px}
  .pat{border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .pat .head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fafcfa;cursor:pointer;user-select:none}
  .pat .num{width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
  .pat .ptitle{font-weight:700;font-size:14.5px}
  .pat .peek{margin-left:auto;font-size:12px;color:var(--green-d);font-weight:700}
  .pat .ans{padding:0 12px;max-height:0;overflow:hidden;transition:max-height .22s ease,padding .22s ease;border-top:1px solid transparent}
  .pat.open .ans{max-height:260px;padding:11px 12px;border-top:1px solid var(--line)}
  .ans .big{font-size:16px;font-weight:800}
  .ans .big.ok{color:var(--green-d)}
  .ans .big.no{color:var(--red)}
  .ans .sub{font-size:12.5px;color:var(--sub);margin-top:3px}
  .ans .why{font-size:12.5px;margin-top:5px;color:var(--ink);background:#f3f7f4;border-radius:7px;padding:6px 9px}

  /* クイズモード */
  .quizrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
  .quizrow .qin{font:inherit;width:120px;padding:7px 9px;border:1.5px solid var(--line);border-radius:8px;text-align:right}
  .quizrow .qin:focus{outline:none;border-color:var(--green)}
  .quizrow .qunit{font-size:13px;color:var(--sub)}
  .quizrow .qimp{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--sub);margin-left:4px}
  .quizrow .qimp input{width:16px;height:16px}
  .quizrow .qres{margin-left:auto;font-size:13.5px;font-weight:800}
  .qres .ok-badge{color:var(--green-d)}
  .qres .ng-badge{color:var(--red)}
  .qres .qkey{font-weight:700;color:var(--ink);font-size:12.5px;margin-left:6px}
  .quizdet{padding:0 12px}
  .quizdet:not(:empty){padding:0 12px 11px}
  .quizbar{display:flex;align-items:center;gap:12px;margin-top:14px}
  .quizbar #quizScore{font-weight:800;font-size:15px;color:var(--green-d)}
  .qnote{font-size:11.5px;color:var(--sub);margin:8px 2px 0}

  details.help{margin-top:12px;font-size:12.5px;color:var(--sub)}
  details.help summary{cursor:pointer;font-weight:700;color:var(--green-d)}
  details.help div{margin-top:6px}
  footer{color:var(--sub);font-size:11.5px;text-align:center;padding:10px 0 26px}
  @media(max-width:560px){
    table.board{font-size:12.5px}
    header.top h1{font-size:17px}
    .ctl select,.ctl input{min-width:64px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>🀄 麻雀トーナメント条件計算ジェネレーター</h1>
    <div class="rule" id="ruleText"></div>
  </header>

  <div class="controls">
    <div class="ctl">
      <label>モード</label>
      <select id="mode">
        <option value="practice" selected>練習</option>
        <option value="quiz">クイズ</option>
      </select>
    </div>
    <div class="ctl">
      <label>ルール</label>
      <select id="ruleset">
        <option value="kyokai" selected>協会</option>
        <option value="wrc">WRC</option>
        <option value="saikoi">最高位戦</option>
      </select>
    </div>
    <div class="ctl">
      <label>難易度</label>
      <select id="difficulty">
        <option value="easy">やさしい</option>
        <option value="normal" selected>ふつう</option>
        <option value="hard">むずかしい</option>
      </select>
    </div>
    <div class="ctl">
      <label>半荘制</label>
      <select id="hanchan">
        <option value="2">2半荘</option>
        <option value="3" selected>3半荘</option>
      </select>
    </div>
    <div class="ctl">
      <label>本場</label>
      <input id="honba" type="number" value="0" min="0" max="20" step="1">
    </div>
    <div class="ctl">
      <label>供託(本)</label>
      <input id="kyotaku" type="number" value="0" min="0" max="10" step="1">
    </div>
    <div class="ctl">
      <label>切り上げ満貫</label>
      <label style="display:flex;align-items:center;gap:6px;padding:7px 4px;font-weight:400;font-size:13px">
        <input id="kiriage" type="checkbox" checked style="width:17px;height:17px"> あり
      </label>
    </div>
    <div class="spacer"></div>
    <div class="ctl">
      <label>プリント問題数</label>
      <input id="numProblems" type="number" value="6" min="1" max="30" step="1" style="width:70px">
    </div>
    <button class="btn-ghost" id="wordBtn">📄 Word保存</button>
    <button class="btn-ghost" id="revealAll">答えを全部表示</button>
    <button class="btn-main" id="newBtn">新しい問題 ↻</button>
  </div>

  <div class="card" id="problem"><!-- rendered --></div>

  <footer>選択したルールの持ち点・返し点・順位点で計算します（協会はオカ込み、WRC・最高位戦はオカなし）。素点が同点なら順位点は折半。合計ポイントが同点なら最終半荘前ポイントが上の人が勝ち抜け。条件は「最終局・和了で上位2名以内に入る最低条件」を全和了点（50符以下＋満貫以上）から探索して算出しています。</footer>
</div>

<script>
/* ============================================================
   ロジック（協会ルール）— Nodeで検証済み
   ============================================================ */
const RULES={
  kyokai:{name:'日本プロ麻雀協会', start:25000, ret:30000, bonus:[50,10,-10,-30],
    desc:'25000点持ち・30000点返し・順位点 1位+50 2位+10 3位−10 4位−30（オカ込み）'},
  wrc:{name:'WRC（リーチ麻雀世界選手権）', start:30000, ret:30000, bonus:[15,5,-5,-15],
    desc:'30000点持ち・30000点返し・ウマ 1位+15 2位+5 3位−5 4位−15（オカなし）'},
  saikoi:{name:'最高位戦', start:30000, ret:30000, bonus:[30,10,-10,-30],
    desc:'30000点持ち・30000点返し・ウマ 1位+30 2位+10 3位−10 4位−30（オカなし）'},
};
let RULE=RULES.kyokai;
let RETURN_POINTS = RULE.ret;
let RANK_BONUS = RULE.bonus.slice();
const sgn=x=>x>0?`+${x}`:`${x}`;
function applyRule(){
  RULE=RULES[$('#ruleset').value]||RULES.kyokai;
  RETURN_POINTS=RULE.ret;
  RANK_BONUS=RULE.bonus.slice();
  $('#ruleText').textContent=`${RULE.name}ルール／${RULE.desc}／2着抜け（上位2名通過）`;
}

const EPS=1e-6;
function computeStandings(players, scores){
  // 素点降順に並べ、同点はグループ化して順位点を折半（等分）
  const idx=[0,1,2,3].sort((a,b)=> scores[b]!==scores[a]? scores[b]-scores[a] : players[a].seat-players[b].seat);
  const bonusT=[0,0,0,0];
  let i=0;
  while(i<4){
    let j=i; while(j<4 && scores[idx[j]]===scores[idx[i]]) j++;
    let sum=0; for(let p=i;p<j;p++) sum+=RANK_BONUS[p];
    const avgT=(sum/(j-i))*10;
    for(let p=i;p<j;p++) bonusT[idx[p]]=avgT;
    i=j;
  }
  const hanchanRank=[0,0,0,0]; idx.forEach((pi,r)=>hanchanRank[pi]=r);
  const totalTenths=[0,0,0,0];
  for(let k=0;k<4;k++){
    const preT=Math.round(players[k].pre*10);
    const rawT=(scores[k]-RETURN_POINTS)/100;
    totalTenths[k]=preT+rawT+bonusT[k];
  }
  // 総合順位：合計pt降順 → 同点なら最終半荘前ポイントが上の方が上位
  const order=[0,1,2,3].sort((a,b)=>{
    if(Math.abs(totalTenths[b]-totalTenths[a])>EPS) return totalTenths[b]-totalTenths[a];
    if(Math.abs(players[b].pre-players[a].pre)>EPS) return players[b].pre-players[a].pre;
    if(scores[b]!==scores[a]) return scores[b]-scores[a];
    return players[a].seat-players[b].seat;
  });
  const overallRank=[0,0,0,0]; order.forEach((pi,r)=>overallRank[pi]=r);
  return {order,totalTenths,hanchanRank,overallRank,bonusT};
}

const LIMIT_HANDS=[
  {han:5,name:'満貫',base:2000},{han:6,name:'跳満',base:3000},
  {han:8,name:'倍満',base:4000},{han:11,name:'三倍満',base:6000},{han:13,name:'役満',base:8000},
];
const ceil100=x=>Math.ceil(x/100)*100;

function enumerateHands(isDealer,isTsumo,kiriage){
  const list=[];
  const push=(han,fu,base,name)=>{
    let total,fromDealer=0,fromChild=0;
    if(isTsumo){
      if(isDealer){ fromChild=ceil100(2*base); total=3*fromChild; }
      else{ fromDealer=ceil100(2*base); fromChild=ceil100(base); total=fromDealer+2*fromChild; }
    } else { total=isDealer?ceil100(6*base):ceil100(4*base); }
    list.push({label:name||`${han}翻${fu}符`,han,fu,base,total,fromDealer,fromChild});
  };
  const fuByHan={1:[30,40,50],2:[20,25,30,40,50],3:[20,25,30,40,50],4:[20,25,30,40,50]};
  const seen=new Set();
  for(let han=1;han<=4;han++) for(const fu of fuByHan[han]){
    if(fu===20&&(!isTsumo||han<2)) continue;
    if(fu===25&&han<2) continue;
    const base=fu*Math.pow(2,2+han);
    if(base>=2000) continue;
    if(kiriage&&base>=1920) continue; // 切り上げ満貫：3翻60符/4翻30符は満貫扱い
    const k=han+'-'+fu; if(seen.has(k))continue; seen.add(k);
    push(han,fu,base,`${han}翻${fu}符`);
  }
  for(const Lh of LIMIT_HANDS) push(Lh.han,null,Lh.base,Lh.name);
  list.sort((a,b)=>a.total-b.total||a.han-b.han);
  const uniq=[],ts=new Set();
  for(const h of list){ if(ts.has(h.total))continue; ts.add(h.total); uniq.push(h); }
  return uniq;
}

function applyAgari(scores,players,targetIndex,dealerSeat,winType,hand,honba,kyotaku){
  const ns=scores.slice();
  const isDealer=players[targetIndex].seat===dealerSeat;
  const honbaPts=honba*300, kyotakuPts=kyotaku*1000;
  if(winType.type==='ron'){
    const from=winType.from;
    ns[targetIndex]+=hand.total+honbaPts+kyotakuPts;
    ns[from]-=hand.total+honbaPts;
  } else {
    const honbaEach=honba*100; let got=0;
    for(let i=0;i<4;i++){ if(i===targetIndex)continue;
      const isDlr=players[i].seat===dealerSeat;
      const pay=(isDealer?hand.fromChild:(isDlr?hand.fromDealer:hand.fromChild))+honbaEach;
      ns[i]-=pay; got+=pay;
    }
    ns[targetIndex]+=got+kyotakuPts;
  }
  return ns;
}

function targetPasses(sc,winType,hand){
  const ns=applyAgari(sc.scores,sc.players,sc.targetIndex,sc.dealerSeat,winType,hand,sc.honba||0,sc.kyotaku||0);
  return computeStandings(sc.players,ns).overallRank[sc.targetIndex]<=1;
}

function solvePattern(sc,winType){
  const isDealer=sc.players[sc.targetIndex].seat===sc.dealerSeat;
  const hands=enumerateHands(isDealer,winType.type==='tsumo',sc.kiriage);
  for(let i=0;i<hands.length;i++){
    if(targetPasses(sc,winType,hands[i]))
      return {possible:true,hand:hands[i],always:i===0,index:i};
  }
  return {possible:false,hand:null,always:false,index:-1};
}

function solveAll(sc){
  const out=[];
  for(let j=0;j<4;j++){ if(j===sc.targetIndex)continue;
    out.push({kind:'ron',from:j,result:solvePattern(sc,{type:'ron',from:j})}); }
  out.push({kind:'tsumo',result:solvePattern(sc,{type:'tsumo'})});
  return out;
}

/* 解説：最小手で和了った後の順位・交わした相手 */
function explain(sc,winType,hand){
  const ns=applyAgari(sc.scores,sc.players,sc.targetIndex,sc.dealerSeat,winType,hand,sc.honba||0,sc.kyotaku||0);
  const st=computeStandings(sc.players,ns);
  const tRank=st.overallRank[sc.targetIndex];
  const thirdIdx=st.order[2];
  const passName=sc.players[thirdIdx].name;
  return {tRank,passName,ns,st};
}

/* ============================================================
   問題ジェネレーター
   ============================================================ */
const SURNAMES=['佐藤','鈴木','高橋','田中','伊藤','渡辺','山本','中村','小林','加藤',
  '吉田','山田','佐々木','山口','松本','井上','木村','林','斎藤','清水',
  '江崎','富永','武中','黄河','大和','三宅','福本','片山','神崎'];
const SEAT_LABEL=['東','南','西','北'];

function randInt(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function randScores(){
  // 100点刻み・合計 4×原点・持ち点に応じた妥当な散らばり
  const start=RULE.start, total=4*start;
  const lo=Math.round(start*0.25/100), hi=Math.round(start*1.5/100);
  const hiCap=Math.round(start*1.8);
  for(let t=0;t<800;t++){
    const a=randInt(lo,hi)*100, b=randInt(lo,hi)*100, c=randInt(lo,hi)*100;
    const d=total-a-b-c;
    if(d>=3000&&d<=hiCap) return shuffle([a,b,c,d]);
  }
  return [start,start,start,start];
}
function randPre(){
  // 0.1刻み・合計0
  const a=randInt(-550,550)/10, b=randInt(-550,550)/10, c=randInt(-550,550)/10;
  let d=-(a+b+c); d=Math.round(d*10)/10;
  return [a,b,c,d];
}

function classify(sc){
  const res=solveAll(sc);
  const st=computeStandings(sc.players,sc.scores);
  const tRank=st.overallRank[sc.targetIndex];      // 0..3
  const totals=res.map(r=>r.result.possible?r.result.hand.total:Infinity);
  const nPoss=totals.filter(t=>t<Infinity).length;
  const minT=Math.min(...totals);
  const tsumo=res.find(r=>r.kind==='tsumo').result;
  const tsumoT=tsumo.possible?tsumo.hand.total:Infinity;
  const anyAlways=res.some(r=>r.result.always);
  return {res,st,tRank,nPoss,minT,tsumoT,anyAlways};
}

let KIRIAGE=true; // 切り上げ満貫（デフォルト:あり）

function buildRandom(){
  const names=shuffle(SURNAMES).slice(0,4);
  const players=names.map((name,i)=>({name,pre:0,seat:i}));
  const pre=randPre(); players.forEach((p,i)=>p.pre=pre[i]);
  const scores=randScores();
  const dealerSeat=randInt(0,3);
  return {players,scores,dealerSeat,targetIndex:0,honba:0,kyotaku:0,kiriage:KIRIAGE};
}

function accept(c,diff){
  // 対象は「現在3着」＝逆転で2着に上がる問題（やさしい/ふつう用）
  if(c.tRank!==2) return false;
  if(c.nPoss===0) return false;
  if(diff==='easy')   return c.nPoss>=3 && c.minT>=1300 && c.minT<=3900 && c.tsumoT<=8000;
  if(diff==='normal') return c.nPoss>=2 && c.minT>=2600 && c.minT<=8000 && c.tsumoT<=16000;
  return false;
}

/* --- むずかしい：打点ではなく「構造の複雑さ」で選ぶ --- */
function kindOf(t){ if(t===Infinity)return 'imp'; if(t<=3900)return 'cheap'; if(t<=8000)return 'mid'; return 'big'; }

// 「討った相手は捲れるのに、別の人に差される」検出（最安手で討っても対象が3着以下）
function leapfrogInfo(sc,from){
  const isDealer=sc.players[sc.targetIndex].seat===sc.dealerSeat;
  const h0=enumerateHands(isDealer,false,sc.kiriage)[0];
  const ns=applyAgari(sc.scores,sc.players,sc.targetIndex,sc.dealerSeat,{type:'ron',from},h0,sc.honba||0,sc.kyotaku||0);
  const st=computeStandings(sc.players,ns);
  const tR=st.overallRank[sc.targetIndex], xR=st.overallRank[from];
  if(tR>1 && xR>tR) return {leap:true, wall:sc.players[st.order[tR-1]].name};
  return {leap:false};
}
// 役満でも上に残るブロッカー名（不可能パターンの説明用）
function blockersAtMax(sc,winType){
  const isDealer=sc.players[sc.targetIndex].seat===sc.dealerSeat;
  const hands=enumerateHands(isDealer,winType.type==='tsumo',sc.kiriage);
  const ns=applyAgari(sc.scores,sc.players,sc.targetIndex,sc.dealerSeat,winType,hands[hands.length-1],sc.honba||0,sc.kyotaku||0);
  const st=computeStandings(sc.players,ns);
  const tR=st.overallRank[sc.targetIndex];
  return st.order.slice(0,Math.min(tR,2)).map(i=>sc.players[i].name);
}

function analyzeComplex(sc){
  const res=solveAll(sc);
  const st=computeStandings(sc.players,sc.scores);
  const tRank=st.overallRank[sc.targetIndex];
  const ron=res.filter(r=>r.kind==='ron');
  const tsumo=res.find(r=>r.kind==='tsumo').result;
  const allTot=[...ron.map(r=>r.result.possible?r.result.hand.total:Infinity),
                tsumo.possible?tsumo.hand.total:Infinity];
  const nPoss=allTot.filter(t=>t<Infinity).length;
  const minPoss=Math.min(...allTot);
  const kinds=new Set(allTot.map(kindOf));
  const leaps=ron.filter(r=>leapfrogInfo(sc,r.from).leap).length;
  return {tRank,nPoss,minPoss,kinds,allTot,leaps};
}
function scoreComplexity(a){
  if(a.tRank!==2||a.nPoss===0) return -1000;
  let s=a.kinds.size*12;
  if(a.allTot.some(t=>t<=3900)) s+=18;                 // 軽い正解口＝読みの問題
  if(a.allTot.some(t=>t===Infinity)) s+=16;            // どれかは不可＝討つ相手が重要
  if(a.allTot[3]===Infinity||a.allTot[3]>=7700) s+=8;  // ツモは楽な逃げ道でない
  if(a.minPoss>5200) s-=14;
  const fin=a.allTot.filter(t=>t<Infinity);
  if(fin.every(t=>t>=8000)) s-=25;                     // 全部満貫級＝打点ゲー
  if(fin.every(t=>t<=2600)) s-=25;                     // 全部激安＝簡単
  s+=a.leaps*22;                                        // まくり→差され構造を優遇
  return s;
}

function generate(diff){
  if(diff==='hard'){
    let best=null,bestS=-1e9;
    for(let t=0;t<8000;t++){
      const sc=buildRandom();
      sc.targetIndex=computeStandings(sc.players,sc.scores).order[2]; // 現在3着
      if(sc.players[sc.targetIndex].seat===sc.dealerSeat) continue;   // 親は対象にしない
      const s=scoreComplexity(analyzeComplex(sc));
      if(s>bestS){bestS=s;best=sc;}
      if(s>=70) return sc;
    }
    return best||buildRandom();
  }
  let last=null;
  for(let t=0;t<6000;t++){
    const sc=buildRandom();
    sc.targetIndex=computeStandings(sc.players,sc.scores).order[2]; // 現在3着
    if(sc.players[sc.targetIndex].seat===sc.dealerSeat) continue;   // 親は対象にしない
    const c=classify(sc);
    last=sc;
    if(accept(c,diff)) return sc;
  }
  return last||buildRandom();
}

}
function fmtPt(t){ // tenths -> string
  const v=t/10; const s=Math.abs(v).toFixed(1);
  return v<0?`▲${s}`:`+${s}`;
}

    <p class="flavor"><b>${hanchan}半荘制</b> の最終半荘・オーラス。下表は<b>最終半荘開始前のトータルポイント</b>と<b>現在の持ち点</b>。${honbaTxt}${kyoTxt}</p>

function gradeQuiz(){
  const sc=current;
  const results=solveAll(sc);
  let correct=0;
  results.forEach((r,idx)=>{
    const res=r.result;
    const imp=$('#quiz-imp-'+idx).checked;
    const raw=($('#quiz-in-'+idx).value||'').replace(/[^0-9]/g,'');
    const num=raw?parseInt(raw,10):NaN;
    let ok,key;
    if(!res.possible){ ok=imp; key='通過不可（条件なし）'; }
    else {
      key=res.hand.total.toLocaleString()+'点以上'+(res.always?'（どの手でも可）':'');
      ok=(!imp)&&Number.isFinite(num)&&num===res.hand.total;
    }
    if(ok) correct++;
    $('#quiz-res-'+idx).innerHTML =
      (ok?'<span class="ok-badge">○ 正解</span>':'<span class="ng-badge">× 不正解</span>')
      +` <span class="qkey">正解：${key}</span>`;
    const wt=r.kind==='ron'?{type:'ron',from:r.from}:{type:'tsumo'};
    $('#quiz-det-'+idx).innerHTML=`<div class="ans" style="max-height:none;padding:6px 0 2px;border:0">${answerHTML(sc,wt,res)}</div>`;
  });
  $('#quizScore').textContent=`　${correct} / 4 正解`;
}

function answerHTML(sc,winType,result){
  const tName=sc.players[sc.targetIndex].name;
  if(!result.possible){
    const bl=blockersAtMax(sc,winType);
    const who=bl.length?`${bl.join('・')} に届かず`:'上位2名に届かず';
    const hint=winType.type==='ron'
      ? `${sc.players[winType.from].name}を直撃しても${who}、このパターンでは通過不可（条件なし）。`
      : `ツモでは${who}、このパターンでは通過不可（条件なし）。`;
    return `<div class="big no">役満でも通過不可</div><div class="sub">${hint}</div>`;
  }
  const h=result.hand;
  const ex=explain(sc,winType,h);
  const rankTxt=ex.tRank===0?'トップに立って通過':`${ex.passName} を交わして2着で通過`;
  let handTxt;
  if(h.fu) handTxt=`${h.han}翻${h.fu}符`; else handTxt=h.label;
  const tsumoSplit=(winType.type==='tsumo')?tsumoSplitText(sc,h):'';
  // まくり→差され構造の注記
  let note='';
  if(winType.type==='ron'){
    const lf=leapfrogInfo(sc,winType.from);
    const vName=sc.players[winType.from].name;
    if(lf.leap && lf.wall!==vName)
      note=`<div class="why" style="background:#fff6e6">💡 ${vName} は軽い手でも捲れますが、それだけでは <b>${lf.wall}</b> を上回れず3着のまま。通過には ${lf.wall} を交わす打点（${h.total.toLocaleString()}点以上）が必要です。</div>`;
  }
  if(result.always){
    return `<div class="big ok">どの手でも通過（${h.total.toLocaleString()}点でも可）</div>
      <div class="sub">最低打点でも上位2名に入ります（${handTxt}${tsumoSplit}）。</div>
      <div class="why">結果：${rankTxt}。</div>${note}`;
  }
  return `<div class="big ok">${h.total.toLocaleString()}点 以上</div>
    <div class="sub">最低条件：<b>${handTxt}</b>${tsumoSplit} 以上</div>
    <div class="why">結果：${rankTxt}。</div>${note}`;
}

function tsumoSplitText(sc,h){
  const isDealer=sc.players[sc.targetIndex].seat===sc.dealerSeat;
  if(isDealer) return `（${h.fromChild.toLocaleString()}オール）`;
  return `（子${h.fromChild.toLocaleString()}／親${h.fromDealer.toLocaleString()}）`;
}

};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function preStr(v){const s=Math.abs(v).toFixed(1);return v<0?'▲'+s:'+'+s;}

const W_CELL='border:1px solid #333333;padding:4px 3px;text-align:center;font-size:10.5pt;';
const W_HDR ='border:1px solid #333333;padding:4px 3px;text-align:center;font-size:10.5pt;background:#eef4ef;font-weight:bold;';
const W_TGT ='background:#fff3c4;';

  const hanchan=$('#hanchan').value;

  let head='',rPre='',rSco='';
  for(let i=0;i<4;i++){
    const p=sc.players[i], isT=i===tIdx, isOya=p.seat===sc.dealerSeat;

    rPre+=`<td style="${cs}">${preStr(p.pre)}</td>`;
    rSco+=`<td style="${cs}">${sc.scores[i].toLocaleString()}</td>`;
  }
  const opp=[0,1,2,3].filter(i=>i!==tIdx);
  const line='＿＿＿＿＿＿＿＿';

  opp.forEach((j,k)=>{ ans+=`<p style="margin:5pt 0;font-size:11pt;">（${k+1}）${esc(sc.players[j].name)} から：${line}点以上　／　通過不可 □</p>`; });

  const rowh=`border:1px solid #333333;padding:4px 3px;text-align:center;font-size:10pt;background:#f6f9f7;font-weight:bold;white-space:nowrap;`;
  const pbrk = (index>0 && index%2===0) ? `<p style="page-break-before:always;margin:0;font-size:1pt;line-height:1pt;">&nbsp;</p>` : '';
  return `${pbrk}<p style="font-size:12.5pt;font-weight:bold;margin:0 0 4pt;">■ 第${index+1}問　<span style="${W_SM}">（${RULE.name}／${DIFF_LABEL[$('#difficulty').value]}／${hanchan}半荘制${extra}）</span></p>
<table border="1" cellspacing="0" cellpadding="4" style="border-collapse:collapse;width:100%;border:1px solid #333333;margin:0 0 6pt;">
<tr><td style="${rowh}">&nbsp;</td>${head}</tr>
<tr><td style="${rowh}">最終半荘前ポイント</td>${rPre}</tr>
<tr><td style="${rowh}">現在の点数</td>${rSco}</tr>
</table>
<p style="margin:3pt 0;font-size:11pt;">Q. <b>${esc(tName)}</b> が2着抜け（上位2名通過）するための和了条件は？${extra}</p>
<p style="margin:0 0 4pt;${W_SM}">まず現在のトータル順位を計算し、各条件の「最低何点で通過か」を記入。</p>
${ans}`;
}
